preprocessing:
  split_ratio: 0.3
  input_trainset: ./data/multiLabel_train.csv
  input_testset: ./data/multiLabel_test.csv
  random_seed: 0
  batch_size: 32
  classes:
    - Computer Science
    - Physics
    - Mathematics
    - Statistics
    - Quantitative Biology
    - Quantitative Finance
  embedding_dim: 100
  input_convertor: nn_vectorization
  input_id_column: Test_ID
  input_text_column: Description
  maxlen: 64
  skip_tokenization: false


training:
  batch_normalization: true
  batch_size: 32
  dropout_rate: 0.5
  embedding_dim: 100
  epochs: 30
  gradient_cliping: true
  learning_rate: 0.07
  maxlen: 64
  model_name: textrnn
  optimizer: sgd
  output_path: ./output
  predict_only: false
  rnn_units: 100

predict:
  output_path: ./data/result.csv
  enable_calibration: true
  calibrator_type: platt_scaling
  calibrators_output_path: ./output
  debug_validation: false
  classes:
    - Computer Science
    - Physics
    - Mathematics
    - Statistics
    - Quantitative Biology
    - Quantitative Finance

