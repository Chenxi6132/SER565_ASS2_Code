preprocessing:
  batch_size: 32
  classes:
  - Functionality_Test_Case
  - User_Interface_Test_Case
  - Performance_Test_Case
  - Integration_Test_Case
  - Usability_Test_Case
  - Database_Test_Case
  - Security_Test_Case
  - User_Acceptance_Test_Case
  embedding_dim: 100
  input_convertor: nn_vectorization
  input_id_column: Test_ID
  input_testset: ./data/test.csv
  input_text_column: Description
  input_trainset: ./data/train.csv
  maxlen: 32
  random_seed: 0
  skip_tokenization: false
  split_ratio: 0.3

training:
  batch_normalization: true
  batch_size: 32
  dropout_rate: 0.5
  embedding_dim: 100
  epochs: 10
  gradient_cliping: true
  learning_rate: 0.8
  maxlen: 32
  model_name: textrnn
  optimizer: sgd
  output_path: ./output
  predict_only: false
  rnn_units: 128

predict:
  classes:
  - Functionality_Test_Case
  - User_Interface_Test_Case
  - Performance_Test_Case
  - Integration_Test_Case
  - Usability_Test_Case
  - Database_Test_Case
  - Security_Test_Case
  - User_Acceptance_Test_Case
  output_path: ./data/result.csv

